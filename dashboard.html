<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Performance Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f2f5f1; --card:#ffffff; --ink:#15302a; --muted:#5d7069; --line:#d9e1dc;
  --teal:#1f7a6d; --amber:#e0a526; --blue:#3b6ea8; --red:#c4443a; --green:#2e8b57;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Public Sans",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1150px;margin:0 auto;padding:24px 18px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;margin-bottom:18px}
h1{margin:0;font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.status{font-size:.85rem;color:var(--muted)}
.status b{color:var(--teal)}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
select,input,button{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
button{background:var(--teal);color:#fff;border-color:var(--teal);cursor:pointer;font-weight:600}
button:hover{filter:brightness(1.1)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:6px;padding:14px 16px}
.kpi:nth-child(2){border-left-color:var(--blue)}
.kpi:nth-child(3){border-left-color:var(--amber)}
.kpi:nth-child(4){border-left-color:var(--green)}
.kpi span{display:block;font-size:.85rem;color:var(--muted)}
.kpi strong{font-size:2rem;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px}
.panel h2{margin:0 0 12px;font-size:1.05rem}
.row{display:grid;grid-template-columns:90px 1fr 46px;gap:10px;align-items:center;margin:7px 0;font-size:.9rem}
.track{background:#e8eee9;border-radius:4px;height:16px;overflow:hidden}
.fill{height:100%;border-radius:4px;transition:width .5s}
.donut-box{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{width:150px;height:150px;border-radius:50%;position:relative;transition:background .4s}
.donut::after{content:"";position:absolute;inset:32px;background:var(--card);border-radius:50%}
.legend div{display:flex;align-items:center;gap:8px;font-size:.9rem;margin:4px 0}
.dot{width:12px;height:12px;border-radius:3px}
.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.badge{padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:600;color:#fff}
.empty{color:var(--muted);padding:12px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Student performance</h1>
    <div class="status" id="status">Loading data…</div>
  </header>

  <div class="controls">
    <select id="city" aria-label="City"><option value="">All cities</option></select>
    <select id="subject" aria-label="Subject"><option value="">All subjects</option></select>
    <input id="search" type="search" placeholder="Search student" aria-label="Search student">
    <button id="refresh">Refresh data</button>
  </div>

  <section class="kpis" id="kpis"></section>

  <section class="grid">
    <div class="panel"><h2>Average marks by student</h2><div id="studentBars"></div></div>
    <div class="panel"><h2>Average marks by subject</h2><div id="subjectBars"></div></div>
    <div class="panel"><h2>Performance categories</h2>
      <div class="donut-box"><div class="donut" id="donut"></div><div class="legend" id="legend"></div></div>
    </div>
    <div class="panel"><h2>Average marks by city</h2><div id="cityBars"></div></div>
  </section>

  <section class="panel">
    <h2>Student report</h2>
    <div class="tablebox"><table>
      <thead><tr>
        <th data-k="student_name">Student</th><th data-k="city">City</th>
        <th data-k="avg">Average</th><th data-k="performance">Performance</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
</div>

<script>
// Fallback sample data, used only if the Flask API is not running
const SAMPLE = {
  students:[[1,'Aarav','Delhi'],[2,'Priya','Mumbai'],[3,'Rahul','Chandigarh'],[4,'Sneha','Pune'],[5,'Arjun','Delhi'],[6,'Kavya','Pune'],[7,'Rohan','Mumbai'],[8,'Isha','Chandigarh']]
    .map(r=>({student_id:r[0],student_name:r[1],city:r[2]})),
  marks:[[1,85,90],[2,75,80],[3,45,50],[4,95,92],[5,60,65],[6,70,78],[7,38,42],[8,88,84]]
    .flatMap(([id,s,p])=>[{student_id:id,subject:'SQL',marks:s},{student_id:id,subject:'Python',marks:p}])
};

const COLORS = {Excellent:'#2e8b57', Good:'#3b6ea8', Average:'#e0a526', Fail:'#c4443a'};
let DB = {students:[], marks:[]};
let sortKey = 'avg', sortDir = -1;
const $ = id => document.getElementById(id);
const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
const grade = v => v>=80 ? 'Excellent' : v>=60 ? 'Good' : v>=40 ? 'Average' : 'Fail';

async function load(){
  try{
    const r = await fetch('/api/data');
    if(!r.ok) throw new Error(r.status);
    DB = await r.json();
    $('status').innerHTML = '<b>Live</b> from SQL Server · updated ' + new Date().toLocaleTimeString();
  }catch(e){
    DB = SAMPLE;
    $('status').textContent = 'Showing sample data. Start app.py to connect to SQL Server.';
  }
  fillFilters();
  render();
}

function fillFilters(){
  const keep = (sel, vals) => {
    const cur = sel.value, first = sel.options[0].outerHTML;
    sel.innerHTML = first + [...new Set(vals)].sort().map(v=>`<option>${v}</option>`).join('');
    sel.value = cur;
  };
  keep($('city'), DB.students.map(s=>s.city));
  keep($('subject'), DB.marks.map(m=>m.subject));
}

function compute(){
  const city = $('city').value, subj = $('subject').value, q = $('search').value.trim().toLowerCase();
  const students = DB.students.filter(s =>
    (!city || s.city===city) && (!q || s.student_name.toLowerCase().includes(q)));
  const ids = new Set(students.map(s=>s.student_id));
  const marks = DB.marks.filter(m => ids.has(m.student_id) && (!subj || m.subject===subj));
  const byId = {};
  marks.forEach(m => (byId[m.student_id] ||= []).push(m.marks));
  const list = students.filter(s=>byId[s.student_id]).map(s => {
    const avg = mean(byId[s.student_id]);
    return {...s, avg, performance:grade(avg)};
  });
  return {list, marks, students};
}

function bars(el, items, color){
  $(el).innerHTML = items.length ? items.map(([n,v,c]) =>
    `<div class="row"><span>${n}</span><div class="track"><div class="fill" style="width:${v}%;background:${c||color}"></div></div><b>${v.toFixed(1)}</b></div>`
  ).join('') : '<div class="empty">No data for this filter.</div>';
}

function group(list, key, valFn){
  const g = {}; list.forEach(x => (g[x[key]] ||= []).push(valFn(x)));
  return Object.entries(g).map(([k,v]) => [k, mean(v)]);
}

function render(){
  const {list, marks} = compute();

  // KPI cards
  const pass = marks.length ? marks.filter(m=>m.marks>=40).length / marks.length * 100 : 0;
  const top = list.slice().sort((a,b)=>b.avg-a.avg)[0];
  $('kpis').innerHTML = [
    ['Students', list.length],
    ['Average marks', mean(marks.map(m=>m.marks)).toFixed(1)],
    ['Pass rate', pass.toFixed(0)+'%'],
    ['Topper', top ? top.student_name : '–']
  ].map(([l,v])=>`<div class="kpi"><span>${l}</span><strong>${v}</strong></div>`).join('');

  // Charts
  bars('studentBars', list.slice().sort((a,b)=>b.avg-a.avg).map(s=>[s.student_name, s.avg, COLORS[s.performance]]));
  const subj = {}; marks.forEach(m => (subj[m.subject] ||= []).push(m.marks));
  bars('subjectBars', Object.entries(subj).map(([k,v])=>[k, mean(v)]), 'var(--teal)');
  bars('cityBars', group(list,'city',s=>s.avg).sort((a,b)=>b[1]-a[1]), 'var(--blue)');

  // Donut
  const counts = {Excellent:0, Good:0, Average:0, Fail:0};
  list.forEach(s => counts[s.performance]++);
  let acc = 0, stops = [];
  Object.entries(counts).forEach(([k,n]) => {
    const p = list.length ? n/list.length*100 : 0;
    stops.push(`${COLORS[k]} ${acc}% ${acc+p}%`); acc += p;
  });
  $('donut').style.background = list.length ? `conic-gradient(${stops.join(',')})` : '#e8eee9';
  $('legend').innerHTML = Object.entries(counts).map(([k,n]) =>
    `<div><span class="dot" style="background:${COLORS[k]}"></span>${k}: ${n}</div>`).join('');

  // Table
  const sorted = list.slice().sort((a,b) => (a[sortKey]>b[sortKey]?1:-1) * sortDir);
  $('rows').innerHTML = sorted.length ? sorted.map(s =>
    `<tr><td>${s.student_name}</td><td>${s.city}</td><td>${s.avg.toFixed(2)}</td>
     <td><span class="badge" style="background:${COLORS[s.performance]}">${s.performance}</span></td></tr>`
  ).join('') : '<tr><td colspan="4" class="empty">No students match. Clear a filter to see results.</td></tr>';
}

['city','subject'].forEach(id => $(id).addEventListener('change', render));
$('search').addEventListener('input', render);
$('refresh').addEventListener('click', load);
document.querySelectorAll('th').forEach(th => th.addEventListener('click', () => {
  const k = th.dataset.k; sortDir = (k===sortKey) ? -sortDir : 1; sortKey = k; render();
}));
setInterval(load, 30000);  // auto-refresh every 30 seconds
load();
</script>
</body>
</html>
